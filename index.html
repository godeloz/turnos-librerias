<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBF9">
<title>Red de librerías · Libros del Fuego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* base limpia */
  --fondo:#FBFBF9;
  --superficie:#FFFFFF;
  --tinta:#16181D;
  --suave:#6E6B63;
  --tenue:#9C988E;
  --linea:#E8E6DF;
  --linea-fuerte:#D2CEC3;

  /* paleta del Salón: solo acento, nunca fondo de pantallas de trabajo */
  --cobalto:#1E6DB4;
  --azul-claro:#87BEE4;
  --coral:#EF6C5A;
  --rosa:#EF70A5;
  --rosa-pal:#F7D6E3;
  --amarillo:#FBDD1D;
  --lima:#92C64F;

  --r:12px;
  --max:620px;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--tinta);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;font-size:16px;
  -webkit-font-smoothing:antialiased;padding-bottom:84px;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
.oculto{display:none!important}

/* etiquetas de dato */
.lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue)}

/* ---------- cabecera ---------- */
header.top{position:sticky;top:var(--alto-tabs,0px);z-index:40;background:var(--fondo);
  border-bottom:1px solid var(--linea)}
.top-in{padding:13px 0 14px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:16px}
.top h1{font-size:.88rem;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.top .meta{font-family:var(--mono);font-size:.66rem;color:var(--suave);margin-top:3px}
.dia-n{text-align:right;line-height:.9;flex:0 0 auto}
.dia-n b{font-size:2.3rem;font-weight:800;letter-spacing:-.05em;display:block}
.dia-n span{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue)}
.pill-lib{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;
  font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;margin-top:5px}

/* ---------- ingreso ---------- */
.portada{padding:40px 0 18px;text-align:center}
.portada .criatura{margin:0 auto 20px;display:block}
.portada h2{font-size:1.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.portada .fecha{font-family:var(--mono);font-size:.72rem;color:var(--suave);margin-top:10px}
.portada .diagrande{font-size:4.2rem;font-weight:800;letter-spacing:-.06em;
  line-height:.85;margin:16px 0 2px;color:var(--cobalto)}
.grupo-lib{margin-top:26px}
.grupo-lib > .lbl{display:block;margin-bottom:10px}
.caras{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.cara{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);
  padding:15px 8px 13px;text-align:center;transition:border-color .15s,transform .1s}
.cara:active{transform:scale(.97)}
.cara .av{margin:0 auto 7px}
.cara b{display:block;font-size:.72rem;font-weight:600;line-height:1.2}

/* ---------- avatares ---------- */
.av{position:relative;border-radius:50%;background:var(--rosa-pal);
  display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .ini{font-family:var(--mono);font-weight:700;color:var(--cobalto)}
.av-ring{padding:2.5px;border-radius:50%;background:var(--linea);display:inline-block;
  flex:0 0 auto;line-height:0}
.av-ring.sala{background:var(--lima)}
.av-ring.descanso{background:var(--amarillo)}
.av-ring.tarde{background:var(--coral)}
.av-ring.salio{background:var(--linea-fuerte)}
.av-104{width:104px;height:104px}.av-72{width:72px;height:72px}
.av-64{width:64px;height:64px}.av-56{width:56px;height:56px}
.av-48{width:48px;height:48px}.av-44{width:44px;height:44px}
.av-40{width:40px;height:40px}.av-36{width:36px;height:36px}
.av-32{width:32px;height:32px}.av-28{width:28px;height:28px}
.av-104 .ini{font-size:2.2rem}.av-72 .ini{font-size:1.5rem}
.av-64 .ini{font-size:1.3rem}.av-56 .ini{font-size:1.1rem}
.av-48 .ini{font-size:1rem}.av-44 .ini{font-size:.9rem}
.av-40 .ini{font-size:.84rem}.av-36 .ini{font-size:.75rem}
.av-32 .ini{font-size:.68rem}.av-28 .ini{font-size:.6rem}
.av-ring{padding:3px}

/* ---------- bloques ---------- */
main{padding-top:26px}
.bloque{background:var(--superficie);border:1px solid var(--linea);
  border-radius:var(--r);padding:18px;margin-bottom:16px}
.bloque > .lbl{display:block;margin-bottom:12px}
.bloque h3{font-size:.95rem;font-weight:700;letter-spacing:-.015em;margin-bottom:4px}
.bloque p.nota{font-size:.78rem;color:var(--suave);line-height:1.5}

/* ---------- acciones ---------- */
.acciones{display:grid;gap:10px;margin-bottom:16px}
.accion{display:flex;align-items:center;gap:12px;padding:15px 16px;
  border-radius:999px;background:var(--superficie);border:1.5px solid var(--tinta);
  font-size:.92rem;font-weight:700;letter-spacing:-.01em;text-align:left;
  transition:transform .1s}
.accion:active{transform:scale(.985)}
.accion .emo{font-size:1.35rem;line-height:1}
.accion .sub{display:block;font-size:.68rem;font-weight:500;color:var(--suave);
  letter-spacing:0;margin-top:1px}
.accion.principal{background:var(--cobalto);border-color:var(--cobalto);color:#fff}
.accion.principal .sub{color:rgba(255,255,255,.72)}
.accion.cierre{background:var(--coral);border-color:var(--coral);color:#fff}
.accion.cierre .sub{color:rgba(255,255,255,.78)}
.accion[disabled]{opacity:.42;border-color:var(--linea-fuerte);background:var(--superficie);
  color:var(--suave);cursor:default}
.accion[disabled] .sub{color:var(--tenue)}

/* ---------- libreros en sala ---------- */
.en-sala{display:flex;flex-wrap:wrap;gap:14px}
.en-sala .uno{text-align:center;width:64px}
.en-sala .uno span{display:block;font-size:.63rem;margin-top:4px;line-height:1.15;
  color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacio{font-size:.8rem;color:var(--tenue);padding:6px 0}

/* ---------- parrilla ---------- */
/* ---------- parrilla del día ---------- */
.gantt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
.gantt-scroll::-webkit-scrollbar{height:6px}
.gantt-scroll::-webkit-scrollbar-thumb{background:var(--linea-fuerte);border-radius:3px}
.gantt{min-width:660px}
.escala{position:relative;height:15px;margin-left:var(--col-nombre);margin-bottom:7px}
.escala span{position:absolute;transform:translateX(-50%);font-family:var(--mono);
  font-size:.58rem;color:var(--tenue)}
:root{--col-nombre:132px}
.fila{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.fila .quien{flex:0 0 var(--col-nombre);display:flex;align-items:center;gap:9px;
  position:sticky;left:0;background:var(--superficie);z-index:3;padding-right:6px}
.fila .quien b{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pista{position:relative;flex:1;height:44px;background:#F4F3EE;border-radius:9px;overflow:hidden}
.pista .g{position:absolute;top:0;bottom:0;width:1px;background:var(--linea)}
.barra{position:absolute;top:0;bottom:0;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;padding:0 8px}
.barra .grad{position:absolute;top:0;bottom:0;pointer-events:none}
.barra .etq{position:relative;z-index:2;font-family:var(--mono);font-size:.62rem;
  font-weight:700;white-space:nowrap;background:rgba(255,255,255,.88);color:var(--tinta);
  padding:2px 7px;border-radius:20px}
.descanso{position:absolute;top:0;bottom:0;z-index:1;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.62) 0 4px,transparent 4px 8px)}
.libre-txt{position:absolute;inset:0;display:flex;align-items:center;padding-left:11px;
  font-size:.7rem;color:var(--tenue)}
.ahora-linea{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta);z-index:5}
.ahora-linea::before{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--tinta)}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.leyenda span{font-family:var(--mono);font-size:.6rem;color:var(--suave)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;
  vertical-align:middle}
.cob{display:flex;gap:2px;margin-left:calc(var(--col-nombre) + 10px);margin-top:12px}
.cob i{flex:1;height:26px;border-radius:4px;font-style:normal;font-family:var(--mono);
  font-size:.62rem;display:grid;place-items:center;color:#fff;font-weight:700}
.cob-lbl{margin-left:calc(var(--col-nombre) + 10px);margin-top:5px}

/* ---------- feed ---------- */
.sep-dia{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.sep-dia .lbl{white-space:nowrap}
.sep-dia .cenefa{flex:1;height:8px;border-radius:4px;
  background:repeating-linear-gradient(90deg,
    var(--cobalto) 0 8px, transparent 8px 14px,
    var(--coral) 14px 20px, transparent 20px 26px,
    var(--amarillo) 26px 32px, transparent 32px 38px,
    var(--lima) 38px 44px, transparent 44px 52px);
  opacity:.5}
.post{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--linea)}
.post:last-child{border-bottom:none}
.post .cuerpo{flex:1;min-width:0}
.post .cab{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.post .cab b{font-size:.82rem;font-weight:700}
.post .cab time{font-family:var(--mono);font-size:.6rem;color:var(--tenue)}
.post .cab .marca{font-size:.58rem;font-weight:600;padding:1px 6px;border-radius:20px;color:#fff}
.post .txt{font-size:.85rem;line-height:1.5;margin-top:3px}
.post.sistema .txt{color:var(--suave)}
.post .acc{display:flex;gap:12px;margin-top:6px}
.post .acc button{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tenue)}
.post.retirada .txt{font-style:italic;color:var(--tenue)}
.compositor{display:flex;gap:10px;align-items:flex-start;background:var(--superficie);
  border:1px solid var(--linea);border-radius:var(--r);padding:12px;margin-bottom:6px}
.compositor textarea{flex:1;border:none;resize:none;min-height:44px;font-size:.86rem;
  line-height:1.45;background:transparent}
.compositor textarea:focus{outline:none}

/* ---------- listas ---------- */
.lista{list-style:none}
.lista li{display:flex;gap:11px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--linea)}
.lista li:last-child{border-bottom:none}
.lista .info{flex:1;min-width:0}
.lista .info b{display:block;font-size:.84rem;font-weight:600}
.lista .info span{display:block;font-size:.72rem;color:var(--suave);margin-top:1px}
.lista .dato{font-family:var(--mono);font-size:.74rem;font-weight:700;white-space:nowrap}

/* ---------- avisos ---------- */
.aviso{border:1px solid var(--linea);border-left-width:4px;border-radius:10px;
  padding:13px 14px;margin-bottom:10px;background:var(--superficie)}
.aviso .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.aviso b{display:block;font-size:.88rem;font-weight:700;letter-spacing:-.01em}
.aviso .cifra{font-size:2rem;font-weight:800;letter-spacing:-.04em;margin-top:2px;line-height:1}
.aviso p{font-size:.79rem;color:var(--suave);line-height:1.5;margin-top:5px}
.chip{font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px;
  color:#fff;white-space:nowrap}
.chip.oscuro{background:var(--tinta)}
.chip.gris{background:var(--linea-fuerte);color:var(--tinta)}

/* ---------- alertas ---------- */
.alerta{border:1px solid var(--coral);background:#FEF4F2;border-radius:10px;
  padding:12px 13px;margin-bottom:9px}
.alerta b{display:block;font-size:.8rem;color:#B33F2E;margin-bottom:2px}
.alerta p{font-size:.76rem;line-height:1.5}
.bien{border:1px solid var(--linea);background:#F6F9F3;border-radius:10px;
  padding:12px 13px;font-size:.79rem;color:var(--suave)}

/* ---------- formularios ---------- */
label.campo{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue);margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--linea-fuerte);
  border-radius:10px;background:var(--superficie);font-size:.88rem}
input[type=checkbox]{width:auto}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:10px;font-size:.82rem;font-weight:700;
  background:var(--tinta);color:#fff;border:1.5px solid var(--tinta)}
.btn.sec{background:var(--superficie);color:var(--tinta);border-color:var(--linea-fuerte)}
.btn.peligro{background:var(--superficie);color:#B33F2E;border-color:var(--coral)}
.btn.mini{padding:7px 11px;font-size:.7rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn-fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pasos{display:inline-flex;align-items:center;gap:2px}
.pasos button{width:30px;height:30px;border:1px solid var(--linea-fuerte);
  background:var(--superficie);font-weight:700;display:grid;place-items:center}
.pasos button:first-child{border-radius:8px 0 0 8px}
.pasos button:last-child{border-radius:0 8px 8px 0}
.pasos .val{font-family:var(--mono);font-weight:700;font-size:.8rem;min-width:46px;
  text-align:center;border-top:1px solid var(--linea-fuerte);
  border-bottom:1px solid var(--linea-fuerte);height:30px;display:grid;place-items:center}
.err{color:#B33F2E;font-size:.76rem;margin-top:8px;line-height:1.45}
.ok{color:#3D7A24;font-size:.76rem;margin-top:8px}

/* ---------- ventanas ---------- */
.velo{position:fixed;inset:0;background:rgba(22,24,29,.55);z-index:80;
  display:grid;place-items:end center;padding:16px;overflow-y:auto}
.modal{background:var(--superficie);border-radius:18px;width:100%;max-width:var(--max);
  padding:22px 20px 20px;margin:auto 0 0;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:640px){.velo{place-items:center}.modal{margin:auto}}
.modal .emo-grande{font-size:3.2rem;line-height:1;text-align:center;margin-bottom:10px}
.modal h3{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;line-height:1.25;
  text-align:center}
.modal .mision{background:var(--rosa-pal);border-radius:12px;padding:14px;margin-top:16px}
.modal .mision .lbl{color:#9C3E68;display:block;margin-bottom:5px}
.modal .mision p{font-size:.92rem;font-weight:600;line-height:1.4}

/* aviso flotante que se desvanece */
.brindis{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:.82rem;font-weight:600;box-shadow:0 6px 22px rgba(0,0,0,.22);
  animation:brindis 3.4s forwards;max-width:88vw;text-align:center}
@keyframes brindis{0%{opacity:0;transform:translate(-50%,12px)}
  12%{opacity:1;transform:translate(-50%,0)}
  78%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- barra inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--superficie);
  border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:var(--max);margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:10px 2px 11px;font-size:.62rem;font-weight:600;
  color:var(--tenue);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.act{color:var(--cobalto)}
nav.tabs button.act svg{stroke-width:2.2}

/* ---------- pie ---------- */
.pie{text-align:center;padding:22px 0 26px}
.pie .op{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tenue)}
.pie .marca{font-family:Georgia,'Times New Roman',serif;font-size:.86rem;
  letter-spacing:.18em;color:var(--suave);margin-top:4px}


/* ---------- navegador de días ---------- */
.dias-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dias-nav::-webkit-scrollbar{display:none}
.dia-chip{flex:0 0 auto;min-width:52px;text-align:center;padding:7px 9px;
  border:1px solid var(--linea-fuerte);border-radius:10px;background:var(--superficie);
  line-height:1.2}
.dia-chip b{display:block;font-size:1.02rem;font-weight:800;letter-spacing:-.03em}
.dia-chip i{display:block;font-style:normal;font-family:var(--mono);font-size:.55rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.dia-chip .dn{display:block;font-family:var(--mono);font-size:.5rem;
  letter-spacing:.06em;color:var(--tenue);margin-top:2px}
.dia-chip.sel{background:var(--cobalto);border-color:var(--cobalto);color:#fff}
.dia-chip.sel i,.dia-chip.sel .dn{color:rgba(255,255,255,.75)}
.dia-chip.hoy{border-color:var(--coral);border-width:1.5px}
.dia-chip.hoy.sel{border-color:var(--cobalto)}

/* selector de librería en línea */
.sel-lib{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.sel-lib button{font-size:.76rem;font-weight:600;padding:9px 15px;
  border-radius:999px;border:1px solid var(--linea-fuerte);background:var(--superficie);
  line-height:1.2}
.sel-lib button.act{color:#fff}

/* ---------- reacciones ---------- */
.reacs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.reac{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;
  padding:3px 9px;border-radius:999px;border:1px solid var(--linea-fuerte);
  background:var(--superficie);line-height:1.3}
.reac.mia{border-color:var(--cobalto);background:#EDF4FB}
.reac b{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--suave)}
.reac.mia b{color:var(--cobalto)}
.reac-mas{font-size:.72rem;color:var(--tenue);padding:3px 8px;border-radius:999px;
  border:1px dashed var(--linea-fuerte)}
.paleta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.paleta button{font-size:1.15rem;padding:3px 6px;border-radius:8px;line-height:1}
.paleta button:hover{background:var(--fondo)}

/* ---------- doble deslizador de jornada ---------- */
.rango{position:relative;height:34px;margin-top:10px}
.rango .via{position:absolute;top:14px;left:0;right:0;height:6px;border-radius:3px;
  background:var(--linea)}
.rango .activo{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--cobalto)}
.rango input[type=range]{position:absolute;top:8px;left:0;width:100%;height:18px;
  margin:0;padding:0;border:none;background:none;pointer-events:none;-webkit-appearance:none;
  appearance:none}
.rango input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:22px;height:22px;border-radius:50%;background:var(--superficie);
  border:2.5px solid var(--cobalto);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rango input[type=range]::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;
  border-radius:50%;background:var(--superficie);border:2.5px solid var(--cobalto);
  cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rango input[type=range]::-moz-range-track{background:none;border:none}
.rango-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rango-cab .franja{font-family:var(--mono);font-size:.74rem;font-weight:700}
.rango-cab .cuantas{font-family:var(--mono);font-size:.66rem;color:var(--suave)}
.rango-topes{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:.54rem;color:var(--tenue);margin-top:-4px}
.persona-fila{padding:14px 0;border-bottom:1px solid var(--linea)}
.persona-fila:last-child{border-bottom:none}

/* fila de parrilla pulsable */
.tocable{cursor:pointer}
.tocable:active{opacity:.7}


/* ---------- diagrama de cobertura ---------- */
.cobmap{display:grid;gap:3px;margin-top:12px}
.cobrow{display:flex;align-items:center;gap:9px}
.cobrow .h{flex:0 0 62px;font-family:var(--mono);font-size:.6rem;color:var(--suave);
  text-align:right}
.cobrow .b{flex:1;height:20px;border-radius:4px;position:relative;background:#F2F1EC}
.cobrow .b span{position:absolute;top:0;bottom:0;left:0;border-radius:4px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
  font-family:var(--mono);font-size:.58rem;font-weight:700;color:#fff}
.cobrow .b em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tinta);
  opacity:.35}

/* ---------- equipo de trabajo ---------- */
.equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
.equipo .uno{text-align:center}
.equipo .uno b{display:block;font-size:.74rem;font-weight:600;margin-top:7px;line-height:1.25}
.equipo .uno span{display:block;font-size:.64rem;color:var(--tenue);margin-top:1px}

/* ---------- perfil ---------- */
.perfil-cab{text-align:center;padding:6px 0 2px}
.perfil-cab h3{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;margin-top:14px}

/* ---------- misiones ---------- */
.mis-fila{padding:13px 0;border-bottom:1px solid var(--linea)}
.mis-fila:last-child{border-bottom:none}
.mis-fila .txt{font-size:.83rem;line-height:1.45;margin-top:3px}
.mis-acc{display:flex;gap:7px;margin-top:9px}
.mis-acc button{font-size:.7rem;font-weight:600;padding:6px 12px;border-radius:999px;
  border:1px solid var(--linea-fuerte);background:var(--superficie)}
.mis-acc button.si.on{background:var(--lima);border-color:var(--lima);color:#1F3300}
.mis-acc button.no.on{background:var(--linea-fuerte);border-color:var(--linea-fuerte)}

/* ---------- feria ---------- */
.feria-cab{background:var(--cobalto);color:#fff;border-radius:var(--r);padding:18px;
  margin-bottom:16px}
.feria-cab .lbl{color:rgba(255,255,255,.7)}
.feria-cab h3{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.feria-cab p{font-size:.78rem;color:rgba(255,255,255,.82);line-height:1.5}
.feria-datos{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.feria-datos div b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.04em;
  line-height:1}
.feria-datos div span{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.7)}
.cuenta{margin-top:18px}
.cuenta b{display:block;font-size:3.4rem;font-weight:800;letter-spacing:-.06em;
  line-height:.9;color:var(--cobalto)}
.pendiente{font-family:var(--mono);font-size:.66rem;color:var(--coral);font-weight:700}

/* ---------- escritorio ---------- */
@media(min-width:900px){
  :root{--max:1060px;--col-nombre:150px}
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:none;
    border-bottom:1px solid var(--linea);background:var(--fondo)}
  nav.tabs button{flex-direction:row;gap:7px;font-size:.78rem;padding:13px 14px}
  main{padding-top:30px}
  .bloque{padding:22px}
  .gantt{min-width:0}
  .gantt-scroll{margin:0;padding:0}
  .equipo{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <button data-v="tablero"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M12 16v5M8 21h8"/></svg>Tablero</button>
